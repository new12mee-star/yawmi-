<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yawmi">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%201024%201024%22%3E%3Crect%20width%3D%221024%22%20height%3D%221024%22%20rx%3D%22220%22%20fill%3D%22%2305060a%22%2F%3E%3Cg%20transform%3D%22translate%28512%20512%29%20scale%28.9%29%20translate%28-560%20-530%29%22%20fill%3D%22none%22%20stroke-width%3D%2284%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M790%20520L500%20800%22%20stroke%3D%22%23c8921c%22%2F%3E%3Cpath%20d%3D%22M500%20520L790%20800%22%20stroke%3D%22%2305060a%22%20stroke-width%3D%22114%22%2F%3E%3Cpath%20d%3D%22M330%20260V800%22%20stroke%3D%22%23f6c445%22%2F%3E%3Cpath%20d%3D%22M330%20260H520A130%20130%200%200%201%20520%20520H330%22%20stroke%3D%22%23f6c445%22%2F%3E%3Cpath%20d%3D%22M500%20520L790%20800%22%20stroke%3D%22%23f6c445%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Yawmi – Daily Planner</title>
<style>
:root{--bg:#07080b;--panel:#12141a;--panel2:#1b1e27;--line:#2a2e3b;--tx:#eceaf6;--mut:#8f95b0;--acc:#8fa3ff;--ok:#7fd8b4;--hi:#ff8a9b;--md:#ffc977;--lo:#7fc4ff;
--r:14px;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
h1{font-size:1.5rem;margin:0;letter-spacing:.2px}
h2{font-size:1.05rem;margin:22px 0 8px;color:var(--mut);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;border-radius:10px}
label.d{display:grid;place-items:center;cursor:pointer;font-size:.72rem}
label.d:has(input:checked){background:var(--acc);color:#12162b;font-weight:700}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin:8px 0 14px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:.7rem;color:var(--mut)}
.bc i{display:block;width:100%;background:linear-gradient(0deg,var(--acc),var(--ok));border-radius:6px 6px 0 0;min-height:2px}
.grp{display:block;width:100%;text-align:left;margin:8px 0 6px;background:var(--panel2)}
input.srch{width:100%;margin-bottom:10px}
textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:inherit;font:inherit;flex:1 1 100%}
.subs{margin-top:6px;display:grid;gap:4px}
.sub{font-size:.88rem;display:flex;gap:6px;align-items:center}
.sub.done{color:var(--mut);text-decoration:line-through}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;color:var(--mut);font-size:.72rem}
.cal i{display:block}
.cd{padding:8px 0;border-radius:8px;background:var(--panel2);color:var(--tx);font-size:.8rem}
.cd.on{background:var(--ok);color:#12162b;font-weight:700}
.cd.now{outline:1px solid var(--acc)}
.tm{font-size:.78rem;color:var(--mut);text-align:center;line-height:1.25;width:46px;flex:none}
.cls{border-left:3px solid var(--acc)}
.live{border-left-color:var(--ok)}
.live .tm{color:var(--ok)}
.sub{color:var(--mut);margin:0 0 14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:8px 12px}
button:hover{background:var(--line)}
button.pri{background:var(--acc);color:#12162b;font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.x{background:none;color:var(--mut);padding:4px 8px}
button.x:hover{color:var(--hi)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input[type=text]{flex:1 1 180px}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .35s}
.big{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px}
.big b{font-size:2rem}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;flex:none;color:#12162b;font-weight:700;line-height:1}
.done .chk{background:var(--ok);border-color:var(--ok)}
.meta{font-size:.78rem;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.p-high{background:var(--hi)}.p-med{background:var(--md)}.p-low{background:var(--lo)}
.over{color:var(--hi)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 11px;border-radius:99px;font-size:.85rem}
.chip.on{background:var(--acc);color:#12162b;font-weight:600}
.days{display:flex;gap:5px}
.d{width:24px;height:24px;border-radius:7px;background:var(--panel2);padding:0;font-size:.65rem;color:var(--mut)}
.d.on{background:var(--ok);color:#12162b;font-weight:700}
.d.now{outline:1px solid var(--acc)}
.streak{font-size:.82rem;color:var(--md);white-space:nowrap}
.wk{display:grid;gap:10px}
.day{background:var(--panel);border-radius:var(--r);padding:10px 12px}
.day.today{border:1px solid var(--acc)}
.day h3{margin:0 0 6px;font-size:.95rem;display:flex;justify-content:space-between}
.day .row{background:var(--panel2);padding:7px 10px;margin-bottom:6px}
.day form{display:flex;gap:6px}
.day input{flex:1;min-width:0;padding:7px 10px;font-size:.9rem}
.day form button{padding:6px 12px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.nav span{flex:1;text-align:center;color:var(--mut)}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
nav.tabs button{flex:1;background:none;font-size:.74rem;padding:10px 1px;color:var(--mut);border-radius:12px}
nav.tabs button.on{background:var(--panel2);color:var(--tx);font-weight:600}
.tools{display:flex;gap:6px}
.tools button{font-size:.8rem;padding:6px 10px}
.mini{padding:3px 9px;font-size:.75rem;margin:4px 6px 0 0}
.note{background:var(--panel2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note span{flex:1;min-width:180px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--tx);color:#12162b;padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:5}
#toast[hidden]{display:none}
#toast button{background:none;color:#3a46a8;font-weight:700;padding:0}
.edit{background:var(--panel);border-radius:var(--r);padding:10px;margin-bottom:8px}
.edit .add{margin:0}
@media(min-width:700px){.wk{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="logo" width="38" height="38" role="img" aria-label="Yawmi logo"><rect width="1024" height="1024" rx="220" fill="#05060a"/><g transform="translate(512 512) scale(.9) translate(-560 -530)" fill="none" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"><path d="M790 520L500 800" stroke="#c8921c"/><path d="M500 520L790 800" stroke="#05060a" stroke-width="114"/><path d="M330 260V800" stroke="#f6c445"/><path d="M330 260H520A130 130 0 0 1 520 520H330" stroke="#f6c445"/><path d="M500 520L790 800" stroke="#f6c445"/></g></svg><h1 id="title">Today</h1></div>
    <div class="tools">
      <button id="exp" title="Download a backup">Export</button>
      <button id="imp" title="Load a backup">Import</button>
      <input id="file" type="file" hidden>
    </div>
  </header>
  <div id="view"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="today">Today</button>
  <button data-tab="tasks">Tasks</button>
  <button data-tab="habits">Habits</button>
  <button data-tab="week">Week</button>
  <button data-tab="sched">Schedule</button>
  <button data-tab="stats">Stats</button>
</nav>

<div id="toast" hidden role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), K='yawmi-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{tasks:[],habits:[],wk:1};
S.born=S.born||Date.now();
S.sched=S.sched||[];
let tab='today', cat='All', off=0, editId=null, lastDel=null, tmr=null, hoff=0, qs='', cmo=0, csel='', fm={mins:25,end:0,left:1500};
const CATS=['Home','Health','Study','Money','Work','Exam','Other'];
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
if(!S.seeded){S.seeded=1;if(!S.sched.length)S.sched=[
['s1','Economie du Maroc','WASSINI ARRASEN',2,'08:30','10:45','4'],
['s2','Histoire de la pensée économique','DINAR',2,'11:00','13:15','1B'],
['s3','Informatique de gestion','CHAKIR AZIZA',3,'13:30','15:45','4'],
['s4','Probabilité','ATMANI AZIZ',4,'08:30','10:45','5'],
['s5','Langue étrangère – Français','EQUIPE DE LANGUE',4,'11:00','13:15','Salles 600 / 700'],
['s6',"Droit de l'entreprise",'NOURI',6,'08:30','10:45','1B'],
['s7','Macroéconomie 2','MSADY ADIL',6,'11:00','13:15','5']
].map(([id,title,teacher,day,start,end,room])=>({id,title,teacher,day,start,end,room}));save()}
function migrate(){let c=0;
  S.habits.forEach(h=>{const n=h.name.trim().toLowerCase();
    if(h.grp===undefined){h.grp=['sobh','dohr','aser','maghrib','ichae'].includes(n)?'Prayers':'';c++}
    if(h.goal===undefined){h.goal=n==='2h working'?2:n==='10 pages of book'?10:0;h.unit=n==='2h working'?'h':n==='10 pages of book'?'pages':'';c++}});
  if(c)save()}
migrate();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o)=>new Date(s+'T12:00').toLocaleDateString('en-US',o);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${x}</option>`).join('');

const isDone=(h,d)=>{const v=h.log[d];return h.goal?v>=h.goal:!!v};
const sched=(h,d)=>{const g=new Date(d+'T12:00').getDay(),f=h.freq||'daily';if(f.startsWith('D:'))return f.slice(2).split(',').includes(String(g));
  return f==='wkdays'?g>0&&g<6:f==='wkend'?g===0||g===6:true};
const weekStart=d=>addDays(d,-((new Date(d+'T12:00').getDay()-S.wk+7)%7));
const wcount=(h,ws)=>{let c=0;for(let i=0;i<7;i++)if(isDone(h,addDays(ws,i)))c++;return c};
const isWeekly=h=>(h.freq||'')[0]==='n';
function streak(h){
  let k=0;
  if(isWeekly(h)){
    const n=+h.freq.slice(1);let ws=weekStart(today());
    if(wcount(h,ws)>=n)k++;
    ws=addDays(ws,-7);
    while(wcount(h,ws)>=n){k++;ws=addDays(ws,-7)}
    return {n:k,u:'week'};
  }
  let d=today();
  if(sched(h,d)&&!isDone(h,d)) d=addDays(d,-1);
  for(let i=0;i<4000;i++){
    if(!sched(h,d)){if(isDone(h,d))k++;d=addDays(d,-1);continue}
    if(isDone(h,d)){k++;d=addDays(d,-1)}else break;
  }
  return {n:k,u:'day'};
}
const sk=s=>s.n?'🔥 '+s.n+' '+s.u+(s.n>1?'s':'')+' in a row':'No streak yet';
const freqLabel=h=>{const f=h.freq||'daily';
  if(f==='daily')return'Every day';if(f.startsWith('D:'))return f.slice(2).split(',').map(g=>DN[g].slice(0,3)).join(', ');if(f==='wkdays')return'Mon–Fri';if(f==='wkend')return'Weekends';
  const n=+f.slice(1);return n+'× per week • '+wcount(h,weekStart(today()))+'/'+n+' this week'};
const freqOpts=()=>[['daily','Every day'],['wkdays','Mon–Fri'],['wkend','Weekends'],...[1,2,3,4,5,6].map(n=>['n'+n,n+'× / week'])].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
const dueToday=h=>{const f=h.freq||'daily',t=today();
  if(f[0]==='n')return isDone(h,t)||wcount(h,weekStart(t))<+f.slice(1);
  return sched(h,t)||isDone(h,t)};
const repOpts=sel=>[['','No repeat'],['daily','Repeat daily'],['weekly','Repeat weekly'],['monthly','Repeat monthly']].map(([v,l])=>`<option value="${v}"${(sel||'')===v?' selected':''}>${l}</option>`).join('');
const nextDate=(s,r)=>{if(r==='daily')return addDays(s,1);if(r==='weekly')return addDays(s,7);
  const d=new Date(s+'T12:00'),g=d.getDate();d.setMonth(d.getMonth()+1);if(d.getDate()!==g)d.setDate(0);return iso(d)};
function toggleTask(t){
  t.done=!t.done;t.doneAt=t.done?today():'';
  if(t.done&&t.rep&&!t.nx){
    let n=nextDate(t.date||today(),t.rep);
    while(n<=today())n=nextDate(n,t.rep);
    const c={...t,id:uid(),date:n,done:false,nx:'',subs:(t.subs||[]).map(x=>({t:x.t,d:false}))};S.tasks.push(c);t.nx=c.id;
  }else if(!t.done&&t.nx){S.tasks=S.tasks.filter(x=>x.id!==t.nx||x.done);t.nx=''}
}
function ok(m,w){if(!m)return;const e=$('#toast');e.innerHTML='<span>'+(w?'⚠ ':'✓ ')+esc(m)+'</span>';e.hidden=false;lastDel=null;clearTimeout(tmr);tmr=setTimeout(hideToast,2200)}
function hideToast(){$('#toast').hidden=true}
function note(msg,u){lastDel=u;const e=$('#toast');e.innerHTML=`<span>${msg}</span><button data-a="undo">Undo</button>`;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(hideToast,6000)}
function banner(){
  const n=S.tasks.length+S.habits.length;
  if(!n||Date.now()-(S.lx||S.born)<6048e5)return'';
  return `<div class="note"><span>Your data lives only in this browser. Download a backup so you never lose it.</span><button class="pri" onclick="$('#exp').click()">Export now</button><button data-a="dis">Later</button></div>`;
}
const editRow=t=>`<form class="edit" data-f="edit" data-id="${t.id}"><div class="add">
<input type="text" name="text" value="${esc(t.text)}" required maxlength="140" aria-label="Task">
<input type="date" name="date" value="${t.date||''}" aria-label="Due date">
<select name="pri" aria-label="Priority">${[['high','High'],['med','Medium'],['low','Low']].map(([v,l])=>`<option value="${v}"${t.pri===v?' selected':''}>${l}</option>`).join('')}</select>
<select name="cat" aria-label="Category">${opts(CATS,t.cat)}</select>
<select name="rep" aria-label="Repeat">${repOpts(t.rep)}</select><textarea name="subs" rows="3" placeholder="Steps, one per line" aria-label="Steps">${esc((t.subs||[]).map(x=>x.t).join('\n'))}</textarea>
<button class="pri">Save</button><button type="button" data-a="ec">Cancel</button></div></form>`;
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const dorder=()=>[0,1,2,3,4,5,6].map(i=>(S.wk+i)%7);
const byStart=(a,b)=>a.start.localeCompare(b.start);
const classesOn=d=>S.sched.filter(c=>c.day===new Date(d+'T12:00').getDay()).sort(byStart);
const nowHM=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};
const cEdit=c=>`<form class="edit" data-f="cedit" data-id="${c.id}"><div class="add"><input type="text" name="title" value="${esc(c.title)}" required maxlength="60" aria-label="Class"><select name="day" aria-label="Day">${dorder().map(g=>`<option value="${g}"${g===c.day?' selected':''}>${DN[g]}</option>`).join('')}</select><input type="time" name="start" value="${c.start}" required aria-label="Start time"><input type="time" name="end" value="${c.end}" required aria-label="End time"><input type="text" name="teacher" value="${esc(c.teacher||'')}" placeholder="Teacher" maxlength="40" aria-label="Teacher"><input type="text" name="room" value="${esc(c.room||'')}" placeholder="Room" maxlength="30" aria-label="Room"><button class="pri">Save</button><button type="button" data-a="ec">Cancel</button></div></form>`;
function classRow(c,d,del){
  if(del&&editId===c.id)return cEdit(c);
  const live=d===today()&&c.start<=nowHM()&&nowHM()<c.end;
  const rm=c.room&&/^\w{1,3}$/.test(c.room)?'Room '+c.room:c.room;
  const meta=[c.teacher,rm,live?'now':''].filter(Boolean).join(' • ');
  return `<div class="row cls${live?' live':''}"><div class="tm">${c.start}<br>${c.end}</div><div class="t">${esc(c.title)}<div class="meta">${esc(meta)}</div></div>${del?`<button class="x" data-a="ce" data-id="${c.id}">Edit</button><button class="x" data-a="cd" data-id="${c.id}" aria-label="Delete class">✕</button>`:''}</div>`;
}
function vSched(){
  $('#title').textContent='Schedule';
  const form=`<form class="add" data-f="cls"><input type="text" name="title" placeholder="Class / subject" required maxlength="60" aria-label="Class"><select name="day" aria-label="Day">${dorder().map(g=>`<option value="${g}">${DN[g]}</option>`).join('')}</select><input type="time" name="start" required aria-label="Start time"><input type="time" name="end" required aria-label="End time"><input type="text" name="teacher" placeholder="Teacher (optional)" maxlength="40" aria-label="Teacher"><input type="text" name="room" placeholder="Room (optional)" maxlength="30" aria-label="Room"><button class="pri">Add class</button></form>`;
  const body=dorder().map(g=>{const l=S.sched.filter(c=>c.day===g).sort(byStart);
    return l.length?`<h2>${DN[g]}</h2>`+l.map(c=>classRow(c,'',true)).join(''):''}).join('');
  return form+'<p class="meta">Weekly classes repeat automatically and appear in Today and Week.</p>'+(body||'<div class="empty">No classes yet. Add your timetable above.</div>');
}
function taskRow(t,showDate,mv){
  if(editId===t.id) return editRow(t);
  const t0=today(), late=!t.done&&t.date&&t.date<t0;
  const meta=[t.cat, showDate&&t.date?fmt(t.date,{month:'short',day:'numeric'}):'',t.rep?'↻ '+t.rep:'',t.cat==='Exam'&&t.date&&!t.done&&t.date>=today()?dleft(t.date):'',t.subs&&t.subs.length?t.subs.filter(x=>x.d).length+'/'+t.subs.length+' steps':''].filter(Boolean).join(' • ');
  return `<div class="row${t.done?' done':''}">
    <button class="chk" data-a="tt" data-id="${t.id}" aria-label="Toggle done">${t.done?'✓':''}</button>
    <span class="dot p-${t.pri}" title="${t.pri} priority"></span>
    <div class="t">${esc(t.text)}<div class="meta${late?' over':''}">${esc(meta)}${late?' • overdue':''}</div>${late?'<button class="mini" data-a="mv" data-id="'+t.id+'" data-n="0">Move to today</button><button class="mini" data-a="mv" data-id="'+t.id+'" data-n="1">Tomorrow</button>':''}${subList(t)}</div>
    ${mv&&!t.done?'<button class="x" data-a="nd" data-id="'+t.id+'" aria-label="Move to next day">→</button>':''}<button class="x" data-a="te" data-id="${t.id}" aria-label="Edit">Edit</button>
    <button class="x" data-a="td" data-id="${t.id}" aria-label="Delete">✕</button>
  </div>`;
}

      mg(S.tasks,d.tasks);mg(S.sched,d.sched);
      d.habits.forEach(h=>{const e=S.habits.find(x=>x.id===h.id);e?Object.assign(e.log,h.log):S.habits.push(h)});
      migrate();save();render();ok('Backup merged')}
  }catch(x){alert('This file is not a valid Yawmi backup.')}};
  r.readAsText(f); e.target.value='';
};
