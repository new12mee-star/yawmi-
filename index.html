<title>Yawmi – Daily Planner</title>
<style>
:root{--bg:#07080b;--panel:#12141a;--panel2:#1b1e27;--line:#2a2e3b;--tx:#eceaf6;--mut:#8f95b0;--acc:#8fa3ff;--ok:#7fd8b4;--hi:#ff8a9b;--md:#ffc977;--lo:#7fc4ff;
--r:14px;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));min-height:100vh;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap}
h1{font-size:1.5rem;margin:0;letter-spacing:.2px}
h2{font-size:1.05rem;margin:22px 0 8px;color:var(--mut);font-weight:600}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;border-radius:10px}
label.d{display:grid;place-items:center;cursor:pointer;font-size:.72rem}
label.d:has(input:checked){background:var(--acc);color:#12162b;font-weight:700}
.bars{display:flex;gap:8px;align-items:flex-end;height:120px;margin:8px 0 14px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:.7rem;color:var(--mut)}
.bc i{display:block;width:100%;background:linear-gradient(0deg,var(--acc),var(--ok));border-radius:6px 6px 0 0;min-height:2px}
.grp{display:block;width:100%;text-align:left;margin:8px 0 6px;background:var(--panel2)}
input.srch{width:100%;margin-bottom:10px}
textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;color:inherit;font:inherit;flex:1 1 100%}
.subs{margin-top:6px;display:grid;gap:4px}
.sub{font-size:.88rem;display:flex;gap:6px;align-items:center}
.sub.done{color:var(--mut);text-decoration:line-through}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;color:var(--mut);font-size:.72rem}
.cal i{display:block}
.cd{padding:8px 0;border-radius:8px;background:var(--panel2);color:var(--tx);font-size:.8rem}
.cd.on{background:var(--ok);color:#12162b;font-weight:700}
.cd.now{outline:1px solid var(--acc)}
.cg{display:grid;grid-template-columns:38px repeat(var(--n),minmax(0,1fr));gap:0 2px;font-size:.7rem}
.ch{text-align:center;padding:4px 0;color:var(--mut)}
.ch b{display:block;font-size:1.05rem;color:var(--tx)}
.ch.now b{color:var(--acc)}
.ca0{color:var(--mut);padding:4px 0;font-size:.62rem}
.ca{display:flex;flex-direction:column;gap:2px;padding-bottom:6px;min-width:0}
.ca span{background:var(--panel2);border-radius:5px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hr{position:relative;color:var(--mut)}
.hr span{position:absolute;right:4px;transform:translateY(-6px);font-size:.62rem}
.cc{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);border-left:1px solid var(--line);overflow:hidden}
.ev{position:absolute;border-radius:6px;padding:2px 4px;color:#12162b;overflow:hidden;line-height:1.2}
.ev b{display:block;font-size:.72rem}
.ev small{opacity:.8}
.ev.dn{opacity:.45;text-decoration:line-through}
.ev[data-a]{cursor:pointer}
.nl{position:absolute;left:0;right:0;height:2px;background:var(--hi);z-index:2}
nav.tabs::-webkit-scrollbar{display:none}
input[type=color]{padding:2px;width:46px;height:38px;cursor:pointer}
.exd{margin-top:6px;font-size:.85rem;line-height:1.55;background:var(--panel2);border-radius:10px;padding:8px 10px}
.thumb{width:78px;height:54px;object-fit:contain;background:#fafaf8;border-radius:8px;cursor:pointer;flex:none}
.full{width:100%;border-radius:10px;margin-top:8px;display:block;background:#fafaf8}
.tm{font-size:.78rem;color:var(--mut);text-align:center;line-height:1.25;width:46px;flex:none}
.cls{border-left:3px solid var(--acc)}
.live{border-left-color:var(--ok)}
.live .tm{color:var(--ok)}
.sub{color:var(--mut);margin:0 0 14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;background:var(--panel2);padding:8px 12px}
button:hover{background:var(--line)}
button.pri{background:var(--acc);color:#12162b;font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.x{background:none;color:var(--mut);padding:4px 8px}
button.x:hover{color:var(--hi)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
input[type=text]{flex:1 1 180px}
.add{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar{height:10px;background:var(--panel);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .35s}
.big{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 6px}
.big b{font-size:2rem}
.row{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--mut)}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;flex:none;color:#12162b;font-weight:700;line-height:1}
.done .chk{background:var(--ok);border-color:var(--ok)}
.meta{font-size:.78rem;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.p-high{background:var(--hi)}.p-med{background:var(--md)}.p-low{background:var(--lo)}
.over{color:var(--hi)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 11px;border-radius:99px;font-size:.85rem}
.chip.on{background:var(--acc);color:#12162b;font-weight:600}
.days{display:flex;gap:5px}
.d{width:24px;height:24px;border-radius:7px;background:var(--panel2);padding:0;font-size:.65rem;color:var(--mut)}
.d.on{background:var(--ok);color:#12162b;font-weight:700}
.d.now{outline:1px solid var(--acc)}
.streak{font-size:.82rem;color:var(--md);white-space:nowrap}
.wk{display:grid;gap:10px}
.day{background:var(--panel);border-radius:var(--r);padding:10px 12px}
.day.today{border:1px solid var(--acc)}
.day h3{margin:0 0 6px;font-size:.95rem;display:flex;justify-content:space-between}
.day .row{background:var(--panel2);padding:7px 10px;margin-bottom:6px}
.day form{display:flex;gap:6px}
.day input{flex:1;min-width:0;padding:7px 10px;font-size:.9rem}
.day form button{padding:6px 12px}
.nav{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.nav span{flex:1;text-align:center;color:var(--mut)}
.empty{color:var(--mut);padding:14px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
nav.tabs{overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
nav.tabs button{flex:1 0 auto;background:none;font-size:.78rem;padding:10px 11px;color:var(--mut);border-radius:12px}
nav.tabs button.on{background:var(--panel2);color:var(--tx);font-weight:600}
.tools{display:flex;gap:6px}
.tools button{font-size:.8rem;padding:6px 10px}
.mini{padding:3px 9px;font-size:.75rem;margin:4px 6px 0 0}
.note{background:var(--panel2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note span{flex:1;min-width:180px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom));background:var(--tx);color:#12162b;padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:5}
#toast[hidden]{display:none}
#toast button{background:none;color:#3a46a8;font-weight:700;padding:0}
.edit{background:var(--panel);border-radius:var(--r);padding:10px;margin-bottom:8px}
.edit .add{margin:0}
@media(min-width:700px){.wk{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" class="logo" width="38" height="38" role="img" aria-label="Yawmi logo"><rect width="1024" height="1024" rx="220" fill="#05060a"/><g transform="translate(512 512) scale(.9) translate(-560 -530)" fill="none" stroke-width="84" stroke-linecap="round" stroke-linejoin="round"><path d="M790 520L500 800" stroke="#c8921c"/><path d="M500 520L790 800" stroke="#05060a" stroke-width="114"/><path d="M330 260V800" stroke="#f6c445"/><path d="M330 260H520A130 130 0 0 1 520 520H330" stroke="#f6c445"/><path d="M500 520L790 800" stroke="#f6c445"/></g></svg><h1 id="title">Today</h1></div>
    <div class="tools">
      <button id="syb" title="Sync across devices">☁ Sync</button><button id="exp" title="Download a backup">Export</button>
      <button id="imp" title="Load a backup">Import</button>
      <input id="file" type="file" hidden>
    </div>
  </header>
  <div id="view"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-tab="today">Today</button>
  <button data-tab="cal">Calendar</button>
  <button data-tab="tasks">Tasks</button>
  <button data-tab="habits">Habits</button>
  <button data-tab="week">Week</button>
  <button data-tab="sched">Routine</button>
  <button data-tab="train">Training</button>
</nav>

<div id="toast" hidden role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s), K='yawmi-v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{tasks:[],habits:[],wk:1};
S.born=S.born||Date.now();
S.sched=S.sched||[];
let tab='today', cat='All', off=0, editId=null, lastDel=null, tmr=null, hoff=0, qs='', cmo=0, csel='', fm={mins:25,end:0,left:1500}, cv=innerWidth>=700?'week':'day', cday='', tday='';
const CATS=['Home','Health','Study','Money','Work','Exam','Other'];
let sb=null;try{sb=JSON.parse(localStorage.getItem('yawmi-sb'))}catch(e){}
let syT=null,syncing=false,syMsg='',syErr='';
const save=()=>{S.updated=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}schedSync()};
if(!S.seeded){S.seeded=1;if(!S.sched.length)S.sched=[
['s1','Economie du Maroc','WASSINI ARRASEN',2,'08:30','10:45','4'],
['s2','Histoire de la pensée économique','DINAR',2,'11:00','13:15','1B'],
['s3','Informatique de gestion','CHAKIR AZIZA',3,'13:30','15:45','4'],
['s4','Probabilité','ATMANI AZIZ',4,'08:30','10:45','5'],
['s5','Langue étrangère – Français','EQUIPE DE LANGUE',4,'11:00','13:15','Salles 600 / 700'],
['s6',"Droit de l'entreprise",'NOURI',6,'08:30','10:45','1B'],
['s7','Macroéconomie 2','MSADY ADIL',6,'11:00','13:15','5']
].map(([id,title,teacher,day,start,end,room])=>({id,title,teacher,day,start,end,room}));save()}
function migrate(){let c=0;
  S.habits.forEach(h=>{const n=h.name.trim().toLowerCase();
    if(h.grp===undefined){h.grp=['sobh','dohr','aser','maghrib','ichae'].includes(n)?'Prayers':'';c++}
    if(h.goal===undefined){h.goal=n==='2h working'?2:n==='10 pages of book'?10:0;h.unit=n==='2h working'?'h':n==='10 pages of book'?'pages':'';c++}});
  if(c)save()}
migrate();
const TRAIN_SEED=[{"tab": "1 Upper", "title": "Day 1 — Upper-body strength", "sub": "Push and pull · Chin-ups + pike push-ups superset (no rest between them) · Session ≈ 60–65 min", "note": "", "ex": [{"n": "Pull-ups", "en": "", "s": "4 × max reps", "c": "Pull your body up until your chin nears the bar", "d": "Execution: Shoulder-width grip, pull until your chin clears the bar, lower with control.\nMuscles: Lats, biceps, forearms.\nBenefit: The best exercise for back width, pulling strength and grip."}, {"n": "Push-ups", "en": "", "s": "4 × 12–15", "c": "Lower with a straight body, then push up", "d": "Execution: Hands shoulder-width, body straight, lower until your chest nears the floor.\nMuscles: Chest, front shoulders, triceps.\nBenefit: The foundation of horizontal pushing strength, no equipment needed.\nRest: A full 90 s before the next exercise."}, {"n": "Decline Push-ups", "en": "", "s": "4 × 10–12", "c": "Feet on a chair, lower with a straight body", "d": "Execution: Feet on a chair, hands on the floor, lower with a straight body.\nMuscles: Upper chest, front shoulders.\nBenefit: Hits the upper chest from a different angle and balances chest size with your back (pike push-ups stay in the plan, so the shoulders are still covered).\nRest: A full 90 s before the next exercise."}, {"n": "Australian Rows", "en": "", "s": "3 × 12", "c": "Pull your chest to the bar and squeeze your shoulder blades", "d": "Execution: Lie under the bar, body straight, pull your chest up while squeezing the shoulder blades.\nMuscles: Upper back, rear shoulders, biceps.\nBenefit: Balances the pressing work, improves posture and protects the shoulders."}, {"n": "Chin-ups", "en": "", "s": "3 × 6–10 · superset with pike push-ups", "c": "Palms facing you, pull your chin over the bar", "d": "Execution: Underhand grip (palms facing you), shoulder-width. Start with arms straight, pull until your chin clears the bar, lower slowly for 3 seconds.\nMuscles: Biceps, lats, forearms.\nBenefit: The best no-equipment biceps exercise; it also completes the back work.\nProgression: Can’t reach 6 reps? Lower slowly (3–4 s) from the top: 3 × 3–5. At 10 reps: add a weighted backpack.\nSuperset: Do one set here, then go straight into pike push-ups with no rest, then rest 75 s."}, {"n": "Pike Push-ups", "en": "", "s": "3 × 10–12 · superset with chin-ups", "c": "Hips high, lower your head between your hands", "d": "Execution: Inverted-V position, lower the head between the hands, then push back up.\nMuscles: Shoulders, upper chest, triceps.\nBenefit: The best dumbbell-free alternative for shoulders.\nSuperset: Do it right after chin-ups with no rest, then rest 75 s."}, {"n": "Hanging Leg Raises", "en": "", "s": "3 × 10–15", "c": "While hanging, raise your knees without swinging", "d": "Execution: Hang with arms straight, raise your knees to your chest without swinging.\nMuscles: Lower abs, hip flexors, grip.\nBenefit: Real core strength, better than traditional ab exercises."}]}, {"tab": "2 Lower", "title": "Day 2 — Lower-body strength", "sub": "Legs and core", "note": "", "ex": [{"n": "Bulgarian Split Squat", "en": "", "s": "4 × 10–12 / leg", "c": "Back foot on a chair, lower down", "d": "Execution: Rear foot on a chair, lower by bending the front knee to 90°.\nMuscles: Quads, glutes.\nBenefit: Single-leg strength that evens out differences between your legs."}, {"n": "Jump Squats", "en": "", "s": "4 × 15", "c": "Squat down, then jump up with maximum power", "d": "Execution: Squat down, explode upward, land softly by bending your knees.\nMuscles: Quads, glutes, calves.\nBenefit: Builds explosive power, the base of any hybrid athlete."}, {"n": "Single-Leg Glute Bridge", "en": "", "s": "3 × 12 / leg", "c": "Lie down and lift your hips driving through one heel", "d": "Execution: Lie down with one knee bent, drive through the heel while squeezing the glutes.\nMuscles: Glutes, hamstrings.\nBenefit: Protects the back and knees by strengthening the glutes with no load."}, {"n": "Single-Leg Calf Raise", "en": "", "s": "3 × 15–20 / leg", "c": "Stand on one leg and rise onto your toes", "d": "Execution: Stand on one leg, rise onto your toes slowly.\nMuscles: Calves.\nBenefit: A neglected muscle that is essential for running strength and ankle health."}, {"n": "Side Plank", "en": "", "s": "3 × 30–45 s / side", "c": "Lie on your side and lift your body in a straight line", "d": "Execution: Lie on your side, lift the body onto your forearm, keep a straight line.\nMuscles: Obliques.\nBenefit: Lateral core stability, important for running and explosive moves."}, {"n": "Hollow Body Hold", "en": "", "s": "3 × 20–30 s", "c": "Lie on your back and press your lower back into the floor", "d": "Execution: Lie down, lift shoulders and legs, press the lower back into the floor.\nMuscles: Deep abs.\nBenefit: Core control that stops power leaking out during movement."}]}, {"tab": "3 Hybrid", "title": "Day 3 — Hybrid rep circuit", "sub": "Strength + explosive power · each exercise has a set number of reps (not seconds) · 4 rounds · do it midweek (e.g. Thursday)", "note": "Round order: do the five exercises in sequence with their reps, moving between them at a comfortable fast pace, then rest 90–120 s and repeat 4 times.\nGoal: the same reps with good technique in every round, and add one rep each week.", "ex": [{"n": "Pull or Row", "en": "", "s": "6–10 pull-ups (or 10–12 rows)", "c": "Pull your body to the bar, or the bar to your chest", "d": "Execution: Choose pull-ups (6–10) or Australian rows (10–12) depending on how you feel today, with full control.\nMuscles: Back, biceps.\nBenefit: Keeps your pulling strength inside the hybrid circuit.\nProgression: When you finish all rounds easily: add one rep or a weighted backpack."}, {"n": "Push-ups", "en": "", "s": "12–15 reps", "c": "Lower with a straight body, then push up", "d": "Execution: Hands shoulder-width, body straight, lower until your chest nears the floor.\nMuscles: Chest, front shoulders, triceps.\nBenefit: The foundation of horizontal pushing strength, no equipment needed."}, {"n": "Jump Squats", "en": "", "s": "10 reps", "c": "Squat down, then jump up with maximum power", "d": "Execution: Squat down, explode upward, land softly by bending your knees (a soft floor is best).\nMuscles: Quads, glutes, calves.\nBenefit: Builds explosive power, the base of any hybrid athlete."}, {"n": "Mountain Climbers", "en": "", "s": "20 reps (each knee = 1)", "c": "In a plank, drive your knees quickly toward your chest", "d": "Execution: In a plank, pull one knee toward your chest then switch. Count each knee as one rep, up to 20.\nMuscles: Core, shoulders, heart.\nBenefit: Combines core strengthening with a cardio boost."}, {"n": "Hanging Knee Raises", "en": "", "s": "10–12 reps", "c": "While hanging, raise your knees without swinging", "d": "Execution: Hang with arms straight, raise your knees toward your chest without swinging, then lower with control.\nMuscles: Lower abs, hip flexors, grip.\nBenefit: The core stability that supports every strength and running movement."}]}, {"tab": "4 Run", "title": "Day 4 — Weekend run (5 km or 10 km)", "sub": "This week’s goal: run 5 km or 10 km · do this day on the weekend (Saturday or Sunday), and keep day 3 midweek", "note": "How to choose: alternate a 5 km week (faster) with a 10 km week (easier), or focus on 10 km if endurance is your goal.\nBefore running: a carb-rich meal the day before and enough water · leave at least two rest days after leg workouts.", "ex": [{"n": "5K Run", "en": "", "s": "5 km · moderate pace", "c": "Steady continuous running, you can only speak in short sentences", "d": "Execution: Warm up 5–8 min (brisk walk + easy jog), then 5 km at a steady “comfortably hard” pace (effort 6–7 out of 10), starting slightly slower than your expected pace. Finish with 5 min walking and stretching.\nMuscles: Heart and lungs, leg muscles.\nBenefit: Builds speed and endurance together, and your 5K time is a clear measure of progress.\nProgression: Record your time and try to improve it by 10–20 s per km gradually. If you can’t complete 5 km yet: alternate 2 min running / 1 min walking until you can."}, {"n": "10K Run", "en": "", "s": "10 km · easy pace", "c": "Comfortable pace where you can speak in full sentences", "d": "Execution: Warm up 5 min, then 10 km at an easy pace (effort 4–5 out of 10). Don’t start fast: the first kilometers should be slightly slower. Finish with 5 min walking and stretching.\nMuscles: Heart and lungs, leg-muscle endurance.\nBenefit: Builds the aerobic base, the foundation of endurance for a hybrid athlete.\nProgression: Haven’t reached 10 km yet? Build gradually: 5 → 6.5 → 8 → 10 km, increasing about 10% per week, with run/walk when needed."}]}];
const seedDays=()=>TRAIN_SEED.map((d,i)=>({id:'d'+(i+1),tab:d.tab,title:d.title,sub:d.sub,note:d.note,ex:d.ex.map((x,j)=>({id:'d'+(i+1)+'e'+(j+1),...x}))}));
function ensureTrain(){if(!S.train)S.train={v:2,days:seedDays(),done:{}}}
function trainUpgrade(){
  if(!S.train||S.train.v===2)return false;
  seedDays().forEach(sd=>{const dy=S.train.days.find(x=>x.id===sd.id);if(!dy)return;
    Object.assign(dy,{tab:sd.tab,title:sd.title,sub:sd.sub,note:sd.note});
    sd.ex.forEach(se=>{const e=dy.ex.find(x=>x.id===se.id);if(e)Object.assign(e,{n:se.n,en:se.en,s:se.s,c:se.c,d:se.d})})});

function streak(h){
  let k=0;
  if(isWeekly(h)){
    const n=+h.freq.slice(1);let ws=weekStart(today());
    if(wcount(h,ws)>=n)k++;

  for(let i=0;i<4000;i++){

  }

}

  <div class="row"><div class="t">Tasks<div class="meta">${wk} completed this week • ${S.tasks.filter(x=>!x.done).length} still open</div></div></div>
  <div class="row"><div class="t">Focus<div class="meta">${Math.round(Object.entries(S.focus||{}).filter(e=>e[0]>=ds[0]).reduce((a,e)=>a+e[1],0))} min in the last 7 days</div></div></div>
  ${calHtml()}<h2>Per habit</h2>`+(rows||'<div class="empty">No habits yet.</div>');
}
function habitRow(h,days){
  if(editId===h.id)return habEdit(h);
  const t0=today();
  const dots=days.map(d=>`<button class="d${isDone(h,d)?' on':''}${d===t0?' now':''}" data-a="ht" data-id="${h.id}" data-d="${d}" aria-label="${fmt(d,{weekday:'long'})}">${fmt(d,{weekday:'narrow'})}</button>`).join('');
  const s=streak(h);
  return `<div class="row">
    <div class="t">${esc(h.name)}<div class="meta">${freqLabel(h)}${h.goal?' • goal '+h.goal+' '+esc(h.unit||''):''}${h.grp?' • '+esc(h.grp):''}${rate(h)}</div><div class="streak">${sk(s)}</div></div>
    <div class="days">${dots}</div>
    <button class="x" data-a="he" data-id="${h.id}">Edit</button><button class="x" data-a="hd" data-id="${h.id}" aria-label="Delete habit">✕</button>
  </div>`;
}
const rate=h=>{if(isWeekly(h))return'';let a=0,b=0;for(let i=0;i<30;i++){const d=addDays(today(),-i);if(sched(h,d)){a++;if(isDone(h,d))b++}}return a?' • 30 days: '+Math.round(b/a*100)+'%':''};
const last7=()=>{const t=addDays(today(),-7*hoff);return[6,5,4,3,2,1,0].map(n=>addDays(t,-n))};
const addTaskForm=(d)=>`<form class="add" data-f="task">
  <input type="text" name="text" placeholder="New task" required maxlength="140" aria-label="Task">
  <input type="date" name="date" value="${d||''}" aria-label="Due date"><input type="time" name="ts" aria-label="Start time"><input type="time" name="te" aria-label="End time">
  <select name="pri" aria-label="Priority"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select>
  <select name="cat" aria-label="Category">${opts(CATS,'Other')}</select>
  <select name="rep" aria-label="Repeat">${repOpts('')}</select>
  <button class="pri">Add task</button></form>`;

const dayNav=t0=>`<div class="nav"><button data-a="tn" data-n="-1" aria-label="Previous day">‹</button><input type="date" id="td" value="${t0}" aria-label="Go to date" style="flex:1"><button data-a="tn" data-n="1" aria-label="Next day">›</button>${t0===today()?'':'<button class="pri" data-a="tt0">Today</button>'}</div>`;
function vToday(){
  const t0=tday||today(),now=t0===today();
  const list=S.tasks.filter(t=>t.date===t0||(now&&!t.done&&t.date&&t.date<t0));
  const hb=S.habits.filter(h=>dueToday(h,t0)), dt=list.filter(t=>t.done).length, dh=hb.filter(h=>isDone(h,t0)).length;
  const total=list.length+hb.length, done=dt+dh, pct=total?Math.round(done/total*100):0;
  $('#title').textContent=fmt(t0,{weekday:'long',month:'long',day:'numeric'});
  return (now?banner():'')+dayNav(t0)+`<p class="sub">${total?`${done} of ${total} done`:'Nothing planned yet'}</p>
  <div class="big"><b>${pct}%</b><span class="meta">${dt}/${list.length} tasks • ${dh}/${hb.length} habits</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  ${classesOn(t0).length?'<h2>'+(now?'Routine today':'Routine')+'</h2>'+classesOn(t0).map(c=>classRow(c,t0)).join(''):''}
  ${examBlock(t0)}<h2>${now?'Tasks for today':'Tasks'}</h2>
  ${list.length?list.sort((a,b)=>a.done-b.done).map(t=>taskRow(t,false)).join(''):'<div class="empty">No tasks '+(now?'due today':'on this day')+'. Add one in Tasks or Week.</div>'}
  <h2>Habits</h2>
  ${habSection(hb,t0)}${now?focusCard():''}`;
}
function taskList(){
  const k=qs.trim().toLowerCase();
  const l=S.tasks.filter(t=>(cat==='All'||t.cat===cat)&&(!k||(t.text+' '+(t.cat||'')+' '+(t.subs||[]).map(x=>x.t).join(' ')).toLowerCase().includes(k))).sort((a,b)=>a.done-b.done||(a.date||'9').localeCompare(b.date||'9'));
  return l.length?l.map(t=>taskRow(t,true)).join(''):'<div class="empty">'+(k?'No matching tasks.':'No tasks here yet.')+'</div>';
}
function vTasks(){
  $('#title').textContent='Tasks';
  const all=['All',...CATS];
  const chips=all.map(c=>`<button class="chip${c===cat?' on':''}" data-a="cat" data-c="${c}">${c}</button>`).join('');
  return addTaskForm(today())+`<input type="search" id="q" class="srch" placeholder="Search tasks" value="${esc(qs)}" aria-label="Search tasks"><div class="chips">${chips}</div><div id="tl">${taskList()}</div>`;
}
function vHabits(){
  $('#title').textContent='Habits';
  return `<form class="add" data-f="habit"><input type="text" name="name" placeholder="New habit, e.g. Read 20 minutes" required maxlength="60" aria-label="Habit"><input type="number" name="goal" min="0" step="any" placeholder="Daily goal (optional)" aria-label="Daily goal"><input type="text" name="unit" placeholder="Unit (pages, h)" maxlength="12" aria-label="Unit"><input type="text" name="grp" placeholder="Group (optional)" maxlength="20" aria-label="Group"><select name="freq" aria-label="How often">${freqOpts()}</select><div class="days" role="group" aria-label="Or pick specific days">${dorder().map(g=>`<label class="d" title="${DN[g]}"><input type="checkbox" name="dd" value="${g}" hidden>${DN[g][0]}</label>`).join('')}</div><button class="pri">Add habit</button></form>
  <div class="nav"><button data-a="hh" data-n="1">‹ Earlier</button><span>${(()=>{const ds=last7();return fmt(ds[0],{month:'short',day:'numeric'})+' – '+fmt(ds[6],{month:'short',day:'numeric'})})()}</span><button data-a="hh" data-n="-1">Later ›</button></div>
  <p class="meta">Tap a day to mark it done. Optionally pick specific days (the circles) instead of the dropdown.</p>`+
  (S.habits.length?S.habits.map(h=>habitRow(h,last7())).join(''):'<div class="empty">Add your first habit above.</div>')+'<h2>Stats</h2>'+(()=>{const h=vStats();$('#title').textContent='Habits';return h})();
}
function vWeek(){
  $('#title').textContent='Week';
  const t0=today(), diff=(new Date().getDay()-S.wk+7)%7;
  const start=addDays(t0,-diff+7*off), days=[0,1,2,3,4,5,6].map(n=>addDays(start,n));
  const lab=`${fmt(days[0],{month:'short',day:'numeric'})} – ${fmt(days[6],{month:'short',day:'numeric'})}`;
  const cols=days.map(d=>{
    const l=S.tasks.filter(t=>t.date===d);
    return `<div class="day${d===t0?' today':''}"><h3><span>${fmt(d,{weekday:'long'})}</span><span class="meta">${fmt(d,{month:'short',day:'numeric'})}</span></h3>
    ${classesOn(d).map(c=>classRow(c,d)).join('')}${l.map(t=>taskRow(t,false,1)).join('')}
    <form data-f="quick" data-d="${d}"><input type="text" name="text" placeholder="Add to this day" maxlength="140" aria-label="Add task on ${fmt(d,{weekday:'long'})}"><button aria-label="Add task">Add</button></form></div>`}).join('');
  return `<div class="nav"><button data-a="wk" data-n="-1">‹ Prev</button><span>${lab}</span><button data-a="wk" data-n="1">Next ›</button><button data-a="wk" data-n="0">This week</button>
  <select id="wks" aria-label="Week starts on"><option value="1"${S.wk==1?' selected':''}>Starts Mon</option><option value="6"${S.wk==6?' selected':''}>Starts Sat</option><option value="0"${S.wk==0?' selected':''}>Starts Sun</option></select></div>
  <div class="wk">${cols}</div>`;
}
function render(){
  $('#view').innerHTML={sync:vSync,cal:vCal,today:vToday,tasks:vTasks,habits:vHabits,week:vWeek,sched:vSched,train:vTrain}[tab]();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  const ab=document.querySelector('#tabs .on');if(ab&&ab.scrollIntoView)ab.scrollIntoView({inline:'center',block:'nearest'});
  document.querySelectorAll('form').forEach(f=>f.noValidate=true);
  const ef=document.querySelector('.edit input[name=text],.edit input[name=title],.edit input[name=name],.edit input[name=n]');if(ef)ef.focus();
  const w=$('#wks'); if(w) w.onchange=()=>{S.wk=+w.value;save();render()};
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){if(tb.dataset.tab==='today'&&tab==='today')tday='';tab=tb.dataset.tab;render();return}
  const b=e.target.closest('[data-a]'); if(!b) return;
  const a=b.dataset.a, id=b.dataset.id, t=S.tasks.find(x=>x.id===id), h=S.habits.find(x=>x.id===id);
  if(a==='tt'&&t){toggleTask(t);if(t.done)ok(t.nx?'Done – next one scheduled':'Task completed')}
  else if(a==='td'&&t){const i=S.tasks.indexOf(t);S.tasks.splice(i,1);note('Task deleted',{k:'tasks',i,v:t})}
  else if(a==='te'&&t) editId=id;
  else if(a==='ec') editId=null;
  else if(a==='ce') editId=id;
  else if(a==='hh') hoff=Math.max(0,hoff+(+b.dataset.n));
  else if(a==='mv'&&t) t.date=addDays(today(),+b.dataset.n);
  else if(a==='dis') S.lx=Date.now();
  else if(a==='cd'){const c=S.sched.find(x=>x.id===id);if(c){const i=S.sched.indexOf(c);S.sched.splice(i,1);note('Item deleted',{k:'sched',i,v:c})}}
  else if(a==='undo'&&lastDel){(lastDel.arr||S[lastDel.k]).splice(lastDel.i,0,lastDel.v);lastDel=null;hideToast()}
  else if(a==='ht'&&h){const d=b.dataset.d;
    if(h.goal){const v=prompt('Amount on '+fmt(d,{month:'short',day:'numeric'})+(h.unit?' ('+h.unit+')':'')+' – goal '+h.goal,h.log[d]||'');if(v!==null){const n=parseFloat(v);n>0?h.log[d]=n:delete h.log[d];if(isDone(h,d))ok('Goal reached')}}
    else{h.log[d]?delete h.log[d]:h.log[d]=1;if(h.log[d])ok('Habit logged')}}
  else if(a==='hs'&&h){const d=b.dataset.d||today(),st=h.goal<=3?.5:h.goal<=12?1:5,was=isDone(h,d),n=Math.max(0,Math.round(((h.log[d]||0)+(+b.dataset.n)*st)*100)/100);n?h.log[d]=n:delete h.log[d];if(!was&&isDone(h,d))ok('Goal reached')}
  else if(a==='he'&&h) editId=id;
  else if(a==='gt'){S.col=S.col||{};S.col[b.dataset.g]=!S.col[b.dataset.g]}
  else if(a==='st'&&t){const x=(t.subs||[])[+b.dataset.i];if(x)x.d=!x.d}
  else if(a==='nd'&&t) t.date=addDays(t.date||today(),1);
  else if(a==='cm') cmo+=+b.dataset.n;
  else if(a==='trd'){trSel=id}
  else if(a==='tra'){const n=prompt('Name of the new training day');if(n&&n.trim()){const nid='d'+uid();S.train.days.push({id:nid,tab:n.trim(),title:n.trim(),sub:'',note:'',ex:[]});trSel=nid}}
  else if(a==='trn'){const dy=S.train.days.find(d=>d.id===trSel),n=dy&&prompt('Rename this day',dy.tab);if(n&&n.trim()){dy.tab=n.trim();dy.title=n.trim()}}
  else if(a==='trdd'){const i=S.train.days.findIndex(d=>d.id===trSel);if(i>=0&&S.train.days.length>1){const v=S.train.days.splice(i,1)[0];trSel='';note('Day deleted',{arr:S.train.days,i,v})}}
  else if(a==='tro') trOpen[id]=!trOpen[id];
  else if(a==='xe') editId=id;
  else if(a==='trx'){const dy=S.train.days.find(d=>d.ex.some(x=>x.id===id));if(dy){const i=dy.ex.findIndex(x=>x.id===id),v=dy.ex.splice(i,1)[0];note('Exercise deleted',{arr:dy.ex,i,v})}}
  else if(a==='trr'){const dn=S.train.done[today()]||{},dy=S.train.days.find(d=>d.id===trSel);if(dy)dy.ex.forEach(x=>delete dn[x.id])}
  else if(a==='trk'){const t0=today(),T=S.train,dy=T.days.find(d=>d.ex.some(x=>x.id===id)),dn=T.done[t0]=T.done[t0]||{};
    if(dn[id])delete dn[id];else{dn[id]=1;
      if(dy.ex.every(x=>dn[x.id])){const nm=dy.id==='d4'?'running':'entrainement',hb=S.habits.find(x=>x.name.trim().toLowerCase()===nm);
        if(hb&&!hb.goal&&!isDone(hb,t0)){hb.log[t0]=1;ok('Workout complete – habit logged')}else ok('Workout complete')}}}
  else if(a==='cvw') cv=b.dataset.v;
  else if(a==='cnv') cday=addDays(cday||today(),(+b.dataset.n)*(cv==='week'?7:1));
  else if(a==='cto') cday='';
  else if(a==='tn') tday=addDays(tday||today(),+b.dataset.n);
  else if(a==='tt0') tday='';
  else if(a==='fm'&&!fm.end){fm.mins=+b.dataset.n;fm.left=fm.mins*60}
  else if(a==='fgo'){if(fm.end){fm.left=focusLeft();fm.end=0}else fm.end=Date.now()+fm.left*1000}
  else if(a==='frs'){fm.end=0;fm.left=fm.mins*60}
  else if(a==='hd'&&h){const i=S.habits.indexOf(h);S.habits.splice(i,1);note('Habit deleted',{k:'habits',i,v:h})}
  else if(a==='cat') cat=b.dataset.c;
  else if(a==='wk'){const n=+b.dataset.n; off=n===0?0:off+n}
  save();render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){qs=e.target.value;$('#tl').innerHTML=taskList()}});
document.addEventListener('change',e=>{if(e.target.id==='fh'){S.fh=e.target.value;save()}else if(e.target.id==='ch'){csel=e.target.value;render()}else if(e.target.id==='td'){tday=e.target.value;render()}else if(e.target.name==='kind'&&e.target.form&&e.target.form.elements.color){e.target.form.elements.color.value=KC[e.target.value]||KC.Class}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target, k=f.dataset.f, v=Object.fromEntries(new FormData(f));
  if(!f.checkValidity()){const bad=[...f.elements].find(x=>x.checkValidity&&!x.checkValidity());ok((bad.getAttribute('aria-label')||'A field')+' is required',1);bad.focus();return}
  if(k!=='quick'&&!(v.text??v.title??v.name??'x').trim()){ok('Please type a name first',1);f.querySelector('input[type=text]').focus();return}
  if(k==='task'){qs='';if(cat!=='All'&&cat!==v.cat)cat='All'}
  if(k==='task') S.tasks.push({id:uid(),text:v.text.trim(),date:v.date||'',pri:v.pri,cat:v.cat,rep:v.rep||'',ts:v.ts||'',te:v.te||'',done:false});
  else if(k==='quick'){if(!v.text.trim()){ok('Type a task first',1);return} S.tasks.push({id:uid(),text:v.text.trim(),date:f.dataset.d,pri:'med',cat:'Other',done:false})}
  else if(k==='xadd'){if(!v.n.trim()){ok('Name the exercise first',1);return}
    const dy=S.train.days.find(d=>d.id===trSel);if(dy)dy.ex.push({id:uid(),n:v.n.trim(),en:(v.en||'').trim(),s:(v.s||'').trim(),c:(v.c||'').trim(),d:(v.d||'').trim()})}
  else if(k==='xedit'){const x=S.train.days.flatMap(d=>d.ex).find(q=>q.id===f.dataset.id);if(x&&v.n.trim())Object.assign(x,{n:v.n.trim(),en:(v.en||'').trim(),s:(v.s||'').trim(),c:(v.c||'').trim(),d:(v.d||'').trim()});editId=null}
  else if(k==='cls'){const dd=new FormData(f).getAll('dd');if(!dd.length){ok('Pick at least one day',1);return}
    dd.forEach(g=>S.sched.push({id:uid(),title:v.title.trim(),kind:v.kind||'Class',color:v.color||KC.Class,day:+g,start:v.start,end:v.end,room:(v.room||'').trim(),teacher:(v.teacher||'').trim()}))}
  else if(k==='cedit'){const c=S.sched.find(x=>x.id===f.dataset.id);if(c&&v.title.trim())Object.assign(c,{title:v.title.trim(),kind:v.kind||'Class',color:v.color||KC.Class,day:+v.day,start:v.start,end:v.end,room:(v.room||'').trim(),teacher:(v.teacher||'').trim()});editId=null}
  else if(k==='edit'){const t=S.tasks.find(x=>x.id===f.dataset.id);if(t&&v.text.trim())Object.assign(t,{text:v.text.trim(),date:v.date||'',pri:v.pri,cat:v.cat,rep:v.rep||'',ts:v.ts||'',te:v.te||''});if(t){const o=t.subs||[];t.subs=(v.subs||'').split('\n').map(x=>x.trim()).filter(Boolean).map(x=>({t:x,d:o.some(q=>q.t===x&&q.d)}))}editId=null}
  else if(k==='hedit'){const h=S.habits.find(x=>x.id===f.dataset.id);if(h&&v.name.trim())Object.assign(h,{name:v.name.trim(),goal:+v.goal||0,unit:(v.unit||'').trim(),grp:(v.grp||'').trim()});editId=null}
  else if(k==='habit') S.habits.push({id:uid(),name:v.name.trim(),log:{},goal:+v.goal||0,unit:(v.unit||'').trim(),grp:(v.grp||'').trim(),freq:(()=>{const dd=new FormData(f).getAll('dd');return dd.length?'D:'+dd.join(','):v.freq||'daily'})()});
  save();render();ok({task:'Task added',quick:'Task added',habit:'Habit added',cls:'Added to routine',edit:'Task saved',cedit:'Routine item saved',xadd:'Exercise added',xedit:'Exercise saved'}[k]);
  const q=document.querySelector('form[data-f=task] input[name=text],form[data-f=habit] input[name=name],form[data-f=cls] input[name=title]'); if(q) q.focus();
});
$('#exp').onclick=()=>{S.lx=Date.now();save();render();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
  a.download='yawmi-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);ok('Backup downloaded');
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!Array.isArray(d.tasks)||!Array.isArray(d.habits)) throw 0;
    if(confirm('Merge this backup into your current data? Nothing will be deleted.')){
      const mg=(a,b)=>{const ids=new Set(a.map(x=>x.id));(b||[]).forEach(x=>{if(!ids.has(x.id))a.push(x)})};
      mg(S.tasks,d.tasks);mg(S.sched,d.sched);if(d.train){ensureTrain();mergeTrain(S.train,d.train)}
      d.habits.forEach(h=>{const e=S.habits.find(x=>x.id===h.id);e?Object.assign(e.log,h.log):S.habits.push(h)});
      migrate();save();render();ok('Backup merged')}
  }catch(x){alert('This file is not a valid Yawmi backup.')}};
  r.readAsText(f); e.target.value='';
};
